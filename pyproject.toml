[project]
name = "bash-auto-comp"
version = "0.1.0"
description = "An auto completion menu for bash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[tool.pyright]
"venvPath" = "."
"venv" = ".venv"
"pythonPlatform" = "Linux"
"typeCheckingMode" = "standard"

[tool.ruff]
line-length = 78
unsafe-fixes = true

[tool.ruff.lint]
extend-select = [
  # flake8-builtins
  "A",
  # flake8-symplify
  "SIM",
]
ignore = ["I", "F401", "F841"]
